name: CPU reproducibility checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts/analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-demo.txt
      - run: python -m compileall -q scripts tests examples
      - run: python -m unittest discover -s tests -v
      - run: python examples/run_toy.py
      - run: python scripts/run_pipeline.py --cohort stephenson --work data/stephenson
